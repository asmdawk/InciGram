name: Build InciGram for Windows
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after a successful build
        type: boolean
        default: true
      tag:
        description: Optional prerelease tag; generated automatically when empty
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      INCIGRAM_API_ID: ${{ secrets.API_ID || secrets.INCIGRAM_API_ID }}
      INCIGRAM_API_HASH: ${{ secrets.API_HASH || secrets.INCIGRAM_API_HASH }}
      RELEASE_TAG: ${{ inputs.tag || format('preview-{0}-{1}', github.run_number, github.run_attempt) }}
    steps:
      - name: Check required configuration before preparing dependencies
        shell: pwsh
        run: |
          if ($env:INCIGRAM_API_ID -notmatch '^\d+$' -or $env:INCIGRAM_API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw 'Add repository Actions secrets API_ID and API_HASH from your own my.telegram.org application. Do not put values in code, issues or chat.'
          }
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') {
            throw 'Invalid release tag.'
          }
      - name: Pin the release tag before the long build
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $reference = & gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" 2>$null
          $lookupExit = $LASTEXITCODE
          if ($lookupExit -eq 0) {
            $tagSha = & gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:BUILD_SHA) { throw 'Tag belongs to another commit. Choose a new version tag.' }
          } else {
            $response = $reference | ConvertFrom-Json
            if ($response.message -ne 'Not Found') { throw 'Unable to inspect the release tag.' }
            & gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:BUILD_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to pin the source tag before building.' }
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          path: tdesktop
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Restore prepared dependencies
        id: dependencies-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            Libraries
            ThirdParty
          key: windows-deps-v1-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: windows-deps-v1-${{ runner.arch }}-
      - name: Prepare libraries and compile the native client
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\incigram\build-windows.ps1'
          $command = 'call "' + $vcvars + '" -vcvars_ver=14.44 && pwsh.exe -NoProfile -File "' + $script + '" -PrepareLibraries'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed; inspect the compiler log.' }
      - name: Save prepared dependencies for subsequent attempts
        if: ${{ always() && steps.dependencies-cache.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            Libraries
            ThirdParty
          key: windows-deps-v1-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package a portable debug preview
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\out\Debug'
          $package = Join-Path $env:GITHUB_WORKSPACE 'package'
          New-Item -ItemType Directory $package -Force | Out-Null
          Copy-Item (Join-Path $build 'InciGram.exe') $package
          Get-ChildItem $build -File | Where-Object { $_.Extension -in '.dll', '.rcc' } | Copy-Item -Destination $package
          Copy-Item 'tdesktop\incigram\PRIVACY.md' $package
          Copy-Item 'tdesktop\incigram\README-RU.md' $package
          Copy-Item 'tdesktop\LICENSE', 'tdesktop\LEGAL' $package
          "Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content (Join-Path $package 'SOURCE.txt')
          Compress-Archive -Path "$package\*" -DestinationPath InciGram-Windows-x64.zip
          Get-FileHash "$package\InciGram.exe", 'InciGram-Windows-x64.zip' -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InciGram-Windows-x64-debug-preview
          path: |
            package/InciGram.exe
            InciGram-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish the compiled files
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          & gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG --clobber 'package/InciGram.exe' 'InciGram-Windows-x64.zip' 'SHA256SUMS.txt'
          } else {
            & gh release create $env:RELEASE_TAG --verify-tag --prerelease --title "InciGram $env:RELEASE_TAG — Windows debug preview" --notes-file 'tdesktop/incigram/RELEASE-NOTES.md' 'package/InciGram.exe' 'InciGram-Windows-x64.zip' 'SHA256SUMS.txt'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; compiled files remain in Actions artifacts.' }
